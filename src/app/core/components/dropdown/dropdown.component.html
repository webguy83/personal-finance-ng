<!-- Trigger: icon-only mode (mobile) -->
@if (iconSrc()) {
  <button
    type="button"
    [id]="triggerId"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    [attr.aria-label]="ariaLabel()"
    class="flex items-center justify-center w-10 h-10 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-grey-900 rounded-lg"
  >
    <span
      class="block w-5 h-5 bg-grey-900 icon-mask"
      [style.mask-image]="'url(' + iconSrc() + ')'"
      aria-hidden="true"
    ></span>
  </button>
} @else {
  <!-- Trigger: text+caret mode (desktop) -->
  <button
    type="button"
    [id]="triggerId"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    class="flex items-center justify-between gap-3 border border-beige-500 rounded-lg px-4 py-3 text-preset-4 text-grey-900 bg-white cursor-pointer hover:border-grey-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-grey-900 transition-colors min-w-[114px] w-full whitespace-nowrap"
  >
    <span>{{ selectedLabel() }}</span>
    <span
      class="block w-3 h-3 bg-grey-900 transition-transform duration-200 shrink-0 icon-mask icon-caret-down"
      [class.rotate-180]="isOpen()"
      aria-hidden="true"
    ></span>
  </button>
}

<!-- Dropdown panel -->
@if (isOpen()) {
  <div
    class="absolute top-[calc(100%+6px)] right-0 z-10 bg-white rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.25)] min-w-full w-max overflow-hidden py-3"
    role="listbox"
    [attr.aria-labelledby]="triggerId"
  >
    @for (opt of options(); track opt.value; let last = $last) {
      <button
        type="button"
        role="option"
        (click)="select(opt.value)"
        [attr.aria-selected]="opt.value === value()"
        class="w-full text-left px-5 py-3 text-preset-4 text-grey-900 hover:bg-grey-100 cursor-pointer transition-colors"
        [class.font-bold]="opt.value === value()"
      >
        {{ opt.label }}
      </button>
      @if (!last) {
        <div class="mx-5 h-px bg-grey-100" aria-hidden="true"></div>
      }
    }
  </div>
}
