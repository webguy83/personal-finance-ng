<!-- Trigger: icon-only mode (mobile) -->
@if (iconSrc()) {
  <button
    type="button"
    [id]="triggerId"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    [attr.aria-label]="ariaLabel() || 'Open menu'"
    class="flex items-center justify-center w-10 h-10 cursor-pointer  focus-visible:ring-2 focus-visible:ring-grey-900 rounded-lg"
  >
    <span
      class="block w-5 h-5 bg-grey-900 icon-mask"
      [style.mask-image]="'url(' + iconSrc() + ')'"
      aria-hidden="true"
    ></span>
  </button>
} @else {
  <!-- Trigger: text+caret mode (desktop) -->
  <button
    type="button"
    [id]="triggerId"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    class="flex items-center justify-between gap-3 border border-beige-500 rounded-lg px-4 py-3 text-preset-4 text-grey-900 bg-white cursor-pointer hover:border-grey-900  focus-visible:ring-2 focus-visible:ring-grey-900 transition-colors min-w-[114px] w-full whitespace-nowrap"
  >
    <span class="flex items-center gap-3 min-w-0">
      @if (selectedOption()?.color) {
        <span class="block w-3 h-3 rounded-full shrink-0" [style.background-color]="selectedOption()!.color!"></span>
      }
      <span class="truncate">{{ selectedLabel() }}</span>
    </span>
    <span
      class="block w-3 h-3 bg-grey-900 transition-transform duration-200 shrink-0 icon-mask icon-caret-down"
      [class.rotate-180]="isOpen()"
      aria-hidden="true"
    ></span>
  </button>
}

<!-- Dropdown panel -->
@if (isOpen()) {
  <div
    class="absolute top-[calc(100%+6px)] right-0 z-10 bg-white rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.25)] min-w-full w-max overflow-hidden py-3"
    role="listbox"
    [attr.aria-labelledby]="triggerId"
  >
    @for (opt of options(); track opt.value; let last = $last) {
      <button
        type="button"
        role="option"
        (click)="select(opt.value)"
        [attr.aria-selected]="opt.value === value()"
        [attr.aria-disabled]="opt.disabled ? 'true' : null"
        [attr.tabindex]="opt.disabled ? -1 : null"
        class="w-full text-left px-5 py-3 text-preset-4 text-grey-900 hover:bg-grey-100 cursor-pointer transition-colors"
        [class.pointer-events-none]="!!opt.disabled"
      >
        <span class="flex items-center gap-3">
          @if (opt.color) {
            <span
              class="block w-3 h-3 rounded-full shrink-0"
              [style.background-color]="opt.color"
              [class.opacity-40]="!!opt.secondaryLabel"
            ></span>
          }
          <span [class.text-grey-500]="!!opt.secondaryLabel">{{ opt.label }}</span>
          @if (opt.value === value()) {
            <img src="/icon-selected.svg" class="ml-auto shrink-0" width="14" height="14" aria-hidden="true" />
          } @else if (opt.secondaryLabel) {
            <span class="ml-auto text-preset-5 text-grey-500 pl-4">{{ opt.secondaryLabel }}</span>
          }
        </span>
      </button>
      @if (!last) {
        <div class="mx-5 h-px bg-grey-100" aria-hidden="true"></div>
      }
    }
  </div>
}
