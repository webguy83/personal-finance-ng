<!-- Donut chart -->
<div class="relative w-full max-w-[240px] mx-auto">
  <svg viewBox="0 0 200 200" class="w-full" aria-hidden="true">
    <defs>
      <!-- clips everything beyond the outer edge of the main ring (r=80 + stroke/2=10 = 90) -->
      <clipPath id="donut-inner-clip">
        <circle cx="100" cy="100" r="90" />
      </clipPath>
    </defs>
    <!-- Gray base ring -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="#F8F4F0" stroke-width="20" />
    <!-- Lighter tinted arcs — clipped so halo only shows on inner edge -->
    @for (seg of segments(); track seg.id) {
      <circle
        cx="100" cy="100" r="80"
        fill="none"
        [attr.stroke]="seg.theme"
        stroke-width="40"
        [attr.stroke-dasharray]="seg.dashArray"
        [attr.stroke-dashoffset]="seg.dashOffset"
        transform="rotate(-90 100 100)"
        opacity="0.25"
        clip-path="url(#donut-inner-clip)"
      />
    }
    <!-- Main coloured segments -->
    @for (seg of segments(); track seg.id) {
      <circle
        cx="100" cy="100" r="80"
        fill="none"
        [attr.stroke]="seg.theme"
        stroke-width="20"
        [attr.stroke-dasharray]="seg.dashArray"
        [attr.stroke-dashoffset]="seg.dashOffset"
        transform="rotate(-90 100 100)"
      />
    }
  </svg>
  <!-- Center overlay -->
  <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none px-6">
    <p class="font-bold leading-tight text-grey-900" [style.font-size]="centerLabelFontSize()">{{ centerLabel() }}</p>
    <p class="text-preset-5 text-grey-500">{{ centerSub() }}</p>
  </div>
</div>

<!-- Legend -->
@if (legendItems().length > 0) {
  @if (legendTitle()) {
    <h2 class="text-preset-2 text-grey-900 mt-8 mb-5">{{ legendTitle() }}</h2>
  }
  <div class="divide-y divide-grey-100">
    @for (item of legendItems(); track item.id) {
      <div class="flex items-center justify-between py-4">
        <div class="flex items-center gap-4">
          <div class="w-1 h-10 rounded-full shrink-0" [style.background-color]="item.theme"></div>
          <p class="text-preset-4 text-grey-900">{{ item.label }}</p>
        </div>
        <div class="text-right">
          <p class="text-preset-4-bold text-grey-900">{{ item.value }}</p>
          <p class="text-preset-5 text-grey-500">{{ item.sub }}</p>
        </div>
      </div>
    }
  </div>
}
